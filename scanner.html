<!DOCTYPE html>
<html>

<head>

<title>Wedding Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
font-family:Arial;
padding:20px;
text-align:center;
background:#f5f5f5;
}

#reader{
width:300px;
margin:auto;
}

#result{
background:white;
padding:20px;
margin-top:20px;
border-radius:10px;
}

</style>

</head>

<body>

<h1>Wedding QR Scanner</h1>

<div id="reader"></div>

<div id="result">
Scan QR Tamu
</div>

<script type="module">

import { db } from "./firebase.js";

import {

doc,
getDoc,
updateDoc

}

from "https://www.gstatic.com/firebasejs/11.7.1/firebase-firestore.js";

const result =
document.getElementById("result");

async function onScanSuccess(decodedText){

const guestRef =
doc(db,"tamu",decodedText);

const guestSnap =
await getDoc(guestRef);

if(guestSnap.exists()){

const data =
guestSnap.data();

if(data.hadir){

result.innerHTML = `
<h2>⚠ QR Sudah Dipakai</h2>
`;

}else{

await updateDoc(guestRef,{
hadir:true
});

result.innerHTML = `
<h2>✅ Selamat Datang</h2>
<h3>${data.Nama}</h3>
`;

}

}else{

result.innerHTML = `
<h2>❌ Tamu Tidak Ditemukan</h2>
`;

}

}

const html5QrcodeScanner =
new Html5QrcodeScanner(
"reader",
{
fps:10,
qrbox:250
}
);

html5QrcodeScanner.render(onScanSuccess);

</script>

</body>
</html>
